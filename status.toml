[[plan.investigation]]
name = "overlay-is-stock-goldplay"
finding = "SOFTEL.OVL is not the demo's own code. bin/SOFTEL.OVL is byte-identical to goldplay/v1.00/GOLDPLAY.OVL (md5 1171f00214f6f1fcad96e704c6a71c0d, both 35715 bytes, both dated 17 Jul 1992), and the file's own header carries 'GoldPlay ver 1.00 (C)opyright 1992 The CodeBlasters'. goldplay/v1.01/goldplay.ovl differs, so the demo shipped v1.00. The reconstruction target is therefore SOFTEL.EXE alone; the overlay is a build INPUT, and goldplay/v1.00 holds its GOLDPLAY.TPU, GOLDPLAY.OBJ and PLAY.ASM."
state = "resolved"
resolution = "Settled by byte comparison before any disassembly. target.original is a one-row table naming ref/softel.bin only; SOFTEL.OVL needs no reconstruction and must not be measured as if it did. Consequence for later: a units/objcheck config for the GoldPlay unit measures a third-party binary we already have the sources for, so it is a build-input check, not a rebuild target."

[[plan.investigation]]
name = "no-build-toolchain"
finding = "Nothing here can build yet. There is no build/ directory, no Turbo Pascal 6 compiler and no build config, so kit.toml cannot answer layout.build or layout.built, and SETUP.md's steps 3-5 (the layout config, the units config, a blocks config) are all blocked: each is filled from a linker map, and there is no linker map until a build runs. Every measuring instrument that compares a rebuild against ref/softel.bin is unreachable until this is resolved. The binary is Borland/Turbo Pascal 6 ('Portions Copyright (c) 1983,90 Borland' at file offset 0x2489), so the compiler is determined, not a choice."
state = "resolved"
resolution = "SOLVED, and it was configuration rather than installation -- everything needed was already on this machine. DOSBox-X sits at D:/DOSBox-X and its drive C: image holds TASM and FOUR Turbo Pascal trees: TP600, TP601, TP700 and TP701. kit.local.toml (gitignored, because a machine path may never appear in a committed file) names the DOSBox binary, the HDD folder and the DOS-side path to each TPC.EXE. build.toml is committed and holds no machine path. Structure was taken from the sibling consumer at ../VangeliSTracker/v1.51 with the owner's agreement; nothing MEASURED there was carried, and the reason is in the [compiler.tp6] comment. PROVEN, not assumed: build.py --selftest compiles under tp6 and again under tp61, and each run emits HELLO.EXE and a detailed HELLO.MAP with a segment table and publics by value. The linker map is the artefact SETUP.md's steps 3-5 were all blocked behind, so link.toml is now written. TWO TRAPS WORTH KEEPING. The sibling's build.toml still says binpath C:/TP6, where these installs USED to live, and its own kit.local.toml records the cost: the build reported SUCCESS without compiling anything, because DOS sets no errorlevel for a command it cannot find. This host writes C:/TP600 and C:/TP601. And this shell's QUOTED heredocs collapse a doubled backslash to a single one, which silently turned every Windows path in the first draft of both config files into invalid TOML; both files now use TOML literal strings, which need no escaping at all. NO CODE-GENERATION SWITCH IS ASSERTED. The switch line is /GD /Q -- a detailed map, and a quiet log. build.py warns that a wrong switch line does not fail but produces a build that MEASURES wrong, and $G+ alone decides whether 286 instructions are emitted. The sibling target read its line out of a shipped TPC.CFG; SOFTEL's distribution has none, so every such switch would be a guess wearing the clothes of a fact. Superseded on the patch level by tp6-patch-level."

[[plan.investigation]]
name = "segment-inventory"
finding = "The load image's own structure, read from ref/softel.bin without a build: 12832 bytes with an 800-byte header, so 12032 bytes of code+data; entry CS:IP 0000:0F94; SS:SP 06C6:0FA0; minalloc 19712 bytes of uninitialised data the loader is asked for. Its 191 fixups name only 5 distinct target segments -- 0160, 018A, 0193, 01F5 and 02EB -- and 01F5 takes 149 of the 191 references, which is the shape of DGROUP rather than of code. What each of the other four segments IS, and which is the PROGRAM, is not yet read."
state = "resolved"
resolution = "WITHDRAWN, and the withdrawal is the point. The reading 'segment 01F5 takes 149 of 191 references, which is the shape of DGROUP rather than of code' is WRONG. The Ghidra memory map says 11f5 is CODE_4, 0x0f60 bytes -- the largest code segment in the image, which is the Turbo Pascal runtime, and 149 references to it is the shape of a runtime being CALLED, not of a data group being addressed. DGROUP is 12eb:0050 onward, and segment 02EB carries only 4 of the 191 fixups. The defect in the method: relocation counts measure how often a segment is NAMED, and a fixup naming a far CALL target looks exactly like one naming a data word, so a count alone cannot separate code from data. Superseded by load-image-segment-map."

[[plan.investigation]]
name = "load-image-segment-map"
finding = "The load image's segmentation, read off the Ghidra memory map (ghidra/Softel.gpr, program SOFTEL.EXE) with first_para 0x1000, and agreeing with the 5 distinct fixup target segments in ref/softel.bin: CODE_0 1000:0000-160f (0x1610 bytes, the PROGRAM -- it is the only segment no fixup names as a target); CODE_1 1160:0010-029f; CODE_2 118a:0000-008f (0x90, the smallest); CODE_3 1193:0000-061f; CODE_4 11f5:0000-0f5f (0x0f60, the largest, and the target of 149 of the 191 fixups -- the runtime); CODE_5 12eb:0000-004f; DATA 12eb:0050-4d4f. The DATA block is 0x4d00 = 19712 bytes, which is EXACTLY the MZ header's minalloc, so Ghidra's DATA block is the loader's BSS request rather than initialised data. Which unit each of CODE_1, CODE_2, CODE_3 and CODE_5 is, is not yet read -- and CODE_1 starting at offset 0x0010 rather than 0x0000 is unexplained."
state = "resolved"
resolution = "The map is read, one segment is IDENTIFIED against a known input, and two of the finding's own claims were wrong. (1) CODE_0's extent is 0x1600, not the 0x1610 Ghidra's block says. Surveyed at 0x1610 the program shows one far return at 160e; surveyed at 0x1600 it shows NONE, which is correct for a program body -- it ends in the runtime's halt, not a RETF. That RETF is 1160:000e, the end of the GoldPlay unit's first routine, and Ghidra had misattributed 16 bytes. (2) Ghidra's CODE_1 starts at 1160:0010 and that is an artefact of block layout, not a fact: the unit's segment begins at 1160:0000, and the block as Ghidra drew it hides the unit's whole first routine, which the program calls. SEGMENT 1160 IS THE GOLDPLAY UNIT, and it is measured rather than inferred. align.locate -- the same core units.py uses -- puts the segment at offset 960 of goldplay/v1.00/GOLDPLAY.TPU, which is where that TPU's symbol names stop and its code begins. Over the 672-byte extent the two differ in 105 runs and NO run is longer than 4 bytes: 20 of width 4, 71 of width 2, 14 of width 1. 104 of the 105 are zero in the TPU, the addend the compiler leaves for a reference somebody else resolves. The EXE's relocation table holds exactly 20 entries landing in this segment, one per 4-byte far pointer; the 2-byte runs are DGROUP offsets and the 1-byte runs near displacements, both resolved at link time and so absent from a load-time table. The single non-zero difference is the last byte, image 00 against TPU c8 -- linker padding against the start of the TPU's next record -- so the unit's code length is 671 and its extent 672. 12eb IS NOT CODE. CODE_5, 80 bytes, is 79 zero bytes and one 02, with no far return, no string and no far call. Its 100% match against GOLDPLAY.TPU at offset 41 is a FALSE POSITIVE and was not reported as anything else: two near-zero regions agree, which is what align.locate is for and not what it proves. The corrected map: 1000:0000+0x1600 the PROGRAM; 1160:0000+0x2a0 GOLDPLAY (671 code, 1 pad); 118a:0000+0x90 unread; 1193:0000+0x620 unread; 11f5:0000+0xf60 the runtime; 12eb:0000+0x50 not code; DATA from 12eb:0050. Superseded for the two unread units by unidentified-units-118a-1193."

[[plan.investigation]]
name = "encaudit-not-recursive"
finding = "kit/tools/encaudit.py has a blind spot that reads as a pass. Its main() globs '*.py' in each directory it is given rather than recursing, so encaudit.dirs = ['kit/tools'] examines the 7 files sitting directly there and never walks the 69 under pascal/, substrate/ and wikitools/ -- and prints '0 site(s) in 7 file(s)', which reads as a clean audit of the tools. Naming all four directories explicitly raises it to 76 files, still 0 sites, so the kit itself is clean and this was a blind spot rather than a hidden defect. This host's kit.toml carries the four-entry workaround with the reason beside it. The fix belongs upstream in the kit (rglob, or a stated non-recursion), together with a wiki observation for the blind spot: eolcheck.py already argues this exact failure -- a count of zero over a tree nothing examined -- and encaudit prints the file count without saying what it declined to walk."
state = "resolved"
resolution = "FIXED UPSTREAM in kit 2f8770c, and the fix went further than the report asked. encaudit.py now rglobs, skips __pycache__, and DEDUPES by resolved path -- the last because a config naming both kit/tools and kit/tools/pascal would otherwise audit pascal twice and print a file count nothing in the tree matches, which is precisely the workaround this host was carrying. It also now RETURNS 1 when it examined no files at all, stating that nothing audited is not the same as nothing wrong. This host's kit.toml is back to one entry, encaudit.dirs = [\"kit/tools\"], and reports 0 site(s) in 77 file(s) -- 77 rather than the 76 measured before, because the kit gained tools/pascal/source.py in the same pull. The workaround is deleted rather than left harmlessly in place: it would have needed extending every time a folder was added, and been silently wrong until somebody noticed."

[[plan.investigation]]
name = "unidentified-units-118a-1193"
finding = "Two units are still unnamed, and what is known about each is a shape rather than a name. Neither writes text: survey.py reports no printable string in either, and by that instrument's own thesis an absence is evidence, so neither ever wrote a message. 118a is 144 bytes with 4 far returns -- RETF 4 at 0020, then bare RETF at 005c, 0078, 0089. It makes 5 distinct far calls out, and 4 of them are the SAME runtime routine 01f5:04df, called once near the head of each routine from 0005, 002f, 0063 and 007f. The program calls 018a:0000 five times and 018a:0024, 002a, 005e and 007a once each; 007a is its init, reached from the startup at 0f9e. 1193 is 1568 bytes with only 2 far returns, at 002c and 043b, and it makes just 2 far calls out -- 01f5:0565 from 0014 and 01f5:056a from 0027, both inside its first 0x2c bytes, so both are in its initialisation and its bodies call nothing at all. A unit of 1568 bytes that leans on the runtime only while initialising is doing arithmetic or writing to hardware directly. The program calls 0193:0000 (its init, from the startup at 0f99), then 02fb eight times, 030d four times, and 0213, 029c, 01c0 and 016b. Neither has a virtual call site, so neither declares an object type with methods. What would settle both is a linker map, which is blocked behind no-build-toolchain; short of that, disasm.py on 1193's init and on 118a's four routines is the next cheap read."
state = "resolved"
resolution = "BOTH IDENTIFIED by disassembly, and only one of them is ours. 1193 IS THE RTL's Crt UNIT. Its init does `mov ah,0x0f; int 10h` (get video mode), then builds two records at DGROUP 0x3b58 and 0x3c58 and hands each to an RTL routine -- 01f5:0565 and 01f5:056a -- which is Input and Output being assigned to the CRT device. 1193:0180 settles it: four byte parameters read off ss:[bx+4..0xa], each validated against [0x3b52] and [0x3b53], then stored as words into [0x3b4c] and [0x3b4e]. That is Crt.Window writing WindMin and WindMax. Crt is now in link.toml's [lists].rtl -- the runtime's units are not ours to transcribe -- and its segment is named Crt. 118a IS OURS, and it is a mode-13h virtual-screen unit of FIVE routines, not four. 0000: procedure(destSeg, srcSeg) doing `rep movsw` with cx=0x7d00 -- 32000 words = 64000 bytes = one 320x200 screen, so a screen copy or flip; retf 4. 0024: `mov ax,0x13; int 0x10; retf` -- set mode 13h, FRAMELESS and five bytes long. 002a: pushes 0xfa00 and calls 01f5:023f, keeps the returned DX:AX as a pointer at [0x351e], then pushes that pointer, 0xfa00 and 0 and calls 01f5:0f36 -- GetMem(64000) followed by FillChar(p,64000,0), so this allocates and clears the virtual screen. 005e: pushes the pointer and 0xfa00 to 01f5:0254 -- FreeMem. 007a: the unit's initialisation, reached from the startup at 0f9e, which calls 01f5:0d55 and nothing else. Code runs to 0x8b with five bytes of zero padding to 0x90. THE SCOPE THIS SETTLES, and it is much smaller than it looked. Of the six segments, 11f5 is System, 1193 is Crt, 1160 is stock GoldPlay and 12eb is DGROUP. THE DEMO'S OWN CODE IS TWO SEGMENTS: the program at 1000, 0x1600 bytes, and this unit at 118a, 0x8b bytes. Nothing else in the image is ours to write."

[[plan.investigation]]
name = "tp6-patch-level"
finding = "Whether SOFTEL was built by TP 6.0 or 6.01 is NOT settled, and the method that was supposed to settle it does not discriminate. The two patch levels do differ. Compiling one identical program under each gives a SYSTEM segment of 0x85c bytes under TP600 and 0x85e under TP601, and the runtimes share a 142-byte prefix and a 251-byte suffix with several insertions between them; realigning past the first insertion leaves 15 differing runs, and the long ones are the same bytes displaced again rather than different code, so the edits accumulate rather than being one 2-byte patch. So a fingerprint exists in principle. It does not work from a hello-world. rtl.py match locates SOFTEL's runtime at seg 11f5 -- which independently confirms that identification -- and scores the original at 25.9% against TP600 and 26.0% against TP601. That is a dead heat, and the sibling consumer records the same result on its own target at 33.1% against 33.0%. The cause is smart linking: a hello-world pulls a different set of runtime routines than a demo, so the agreement figure is dominated by WHICH routines are present rather than by how each is compiled. The blind spot is therefore in the comparison, not in the tool. WHAT WOULD SETTLE IT: build the real program once src/ has one, so the two images pull a comparable set of routines, and run rtl.py match again like for like. Until then build.toml declares both installs so the question stays measurable, and tp6 is the default only because it must be something."
state = "open"

[[plan.investigation]]
name = "dgroup-is-12eb"
finding = "CORRECTED, and the correction matters for link.toml. The claim that 12eb is 'NOT code -- 79 zero bytes and one 02' is right that it is not code and wrong about what it is: 12eb IS DGROUP, and those 80 bytes are its INITIALISED head. Measured: the load image is 12032 bytes, and 12eb:0050 in image coordinates is 0x2f00 = 12032 exactly, so the file ends 0x50 bytes into this paragraph and everything past that point is the loader's BSS -- which the MZ header's minalloc asks for as 19712 bytes, matching the 0x4d00 Ghidra drew as its DATA block. Ghidra calls 12eb:0000..004f 'CODE_5' because four fixups name paragraph 02eb, but those are references TO the data group -- a MOV AX,DGROUP loading DS -- and not code inside it. So end_at and dgroup_at are both 0x12eb, and link.toml carries 12eb in its [data] list rather than its segment list."
state = "resolved"
resolution = "Applied. link.toml lists 12eb under [data] with the reason, and sets both end_at and dgroup_at to 0x12eb; CLAUDE.md's segment table says DGROUP's initialised head rather than 'not code'. Nothing measured rests on the old reading -- it was written and corrected inside one session -- but the method defect is worth keeping: a fixup that NAMES a paragraph is evidence about the paragraph's role only if you know which direction the reference points, and Ghidra's block classifier does not, so it drew a code segment over the data group's first 80 bytes. This is the second time on this target that reading a role off relocation data was wrong; the first is segment-inventory."

[[plan.investigation]]
name = "binpath-derived-not-typed"
finding = "Removed a machine path from a committed config, on the kit's own evidence. kit c80b0cd derives the DOS bin directory from `toolchain.<compiler>` in kit.local.toml -- the answer that actually invokes the compiler -- so build.toml no longer carries `binpath` for tp6 or tp61. This host's typed copies were CORRECT when written, which is exactly why removing them is worth recording rather than shrugging at: the kit's new observation `typed-copy-of-a-derived-path` measured 15 stale entries across five configs in the sibling consumer against 4 correct ones here, same tool and same mechanism, the difference being only whether that repository had been through a rename. The duplicate lived on the side where being wrong is free -- every invocation BUILD.BAT writes is fully qualified, so the PATH line the typed copy feeds is read by nobody during a build, and fails only at an interactive prompt one person uses occasionally. VERIFIED after removal: build.py --selftest still compiles under tp6, so the derivation reaches the same directory the typed value named."
state = "resolved"
resolution = "Applied and verified in the same iteration; recorded as an investigation rather than a silent edit because the removal deletes a value that was right, and a later reader finding no binpath should be able to tell a deliberate deletion from an omission."

[[plan.investigation]]
name = "survey-misses-frameless-returns"
finding = "survey.py's routine census cannot see a frameless routine, and the count it prints instead reads as a fact. returns() matches the regex [É]](Ê|Ë) -- a far return IMMEDIATELY PRECEDED by LEAVE or POP BP. Its docstring states that requirement; what it does not state is the consequence, which is that a routine reading its parameters off ss:[bx+n] after `mov bx,sp` -- the shape assembler routines and the RTL's own units use -- ends in a bare RETF and is invisible. MEASURED ON THIS TARGET. survey reported 2 far returns in 1193 and 4 in 118a. Disassembly confirms at least two more in 1193 -- Crt.Window's retf 8 at 01bd and a retf 2 at 017d -- and one more in 118a, the frameless mode-set at 0029, so 118a has five routines rather than four. A raw CA/CB byte scan of 1193 finds 33 far returns of which 31 are frameless; that scan OVERCOUNTS (operands such as 8056 and 5770 are plainly data, not stack-cleanup counts) and is not the corrected census -- it establishes the direction and the magnitude, not the number. By contrast 1160, GoldPlay's Pascal unit, is 9 framed and 0 frameless, and survey was exactly right there. WHY IT MATTERS BEYOND THIS TARGET: the count is documented as 'the routine census; the count is a signature', and this project drew an inference straight off it -- a 1568-byte segment showing 2 returns was read as a unit of very few routines. It is really a unit of about thirty assembler ones. That generalises to any binary built this way, so it wants a kit fix AND a wiki observation for the blind spot: report frameless returns separately rather than not at all, since a bare RETF cannot be told from a CA byte in data without a decoder, and the honest output is two counts with the second marked as an upper bound."
state = "resolved"
resolution = "FIXED UPSTREAM in kit fee3f0b, with the wiki observation `anchored-scan-names-its-reach` beside it. returns() keeps its anchored, certain scan and its docstring now states the CONSEQUENCE rather than just the requirement; a new frameless() reports the rest as an explicit UPPER BOUND in two classes -- `RETF nn` with an even operand no greater than 32, and bare RETF, called out as the weaker signal because it has no operand to filter on. Neither number is called a census any more. RE-RUN ON THIS TARGET, because a tool that becomes right is worth re-asking every open question (the kit's own `instruments-have-an-order`): 118a now reports 4 framed plus 1 bare candidate, which is EXACTLY the five routines disassembly confirmed. 1193 reports 2 framed plus 11 sized and 14 bare, and the filter kept 017d/2 and 01bd/8 -- both confirmed by disassembly as Crt.Window and its neighbour -- while rejecting 180, 2539, 4075, 5634, 5770 and 8056, every one of which is data. 1160 reports 9 framed and 0 frameless, unchanged and still exactly right for GoldPlay's Pascal unit. So the bound is tight where it can be and honest where it cannot. CLAUDE.md's warning not to trust the count is removed, because the count no longer claims to be one."

[[plan.investigation]]
name = "rtl-routines-by-call-shape"
finding = "Five runtime entry points now have candidate names, read off how 118a calls them rather than from their bodies. 01f5:023f -- given 0xfa00 on the stack, returns a pointer in DX:AX: GetMem. 01f5:0f36 -- given a pointer, 0xfa00 and 0: FillChar. 01f5:0254 -- given a pointer and 0xfa00, returns nothing: FreeMem. 01f5:0565 and 01f5:056a -- each given DS:DI pointing at a 256-plus-byte DGROUP record during Crt's init: the text-file assign and open pair. 01f5:04df -- called at the head of EVERY framed routine in 118a with `xor ax,ax` immediately before it, so with a size of zero in AX. THESE ARE INFERENCES FROM CALL SHAPE, NOT MEASUREMENTS. rtl.py find is the instrument that confirms a runtime routine, by taking its BODY from a reference and searching -- and it does not report a pattern that matches more than once, so a name it gives is evidence. It needs an RTL.toml naming a reference part and its confirmed offsets, which this target does not have yet. 04df IS THE INTERESTING ONE. A per-routine call with a size in AX at every framed prologue is the shape of a stack check, which would mean the original was compiled $S+ -- and $S+ is TP6's own default, so our build.toml, which asserts no code-generation switch, would already agree. That is worth MEASURING rather than reasoning about: codegen.py exists to put a construct in a probe unit and compare compilers, and the toolchain is now proven, so a unit compiled /$S+ against /$S- settles whether that prologue is what $S+ emits."
state = "resolved"
resolution = "01f5:04df IS THE STACK CHECK, and SOFTEL's own code was compiled $S+. MEASURED, by probes/STACKCHK.PAS through codegen.py against two build.toml entries that differ only in that switch. Under /$S+ a procedure taking parameters and declaring nothing compiles to `55 89 e5 31 c0 9a 00 00 00 00` -- push bp, mov bp,sp, xor ax,ax, lcall to an unresolved far pointer. 118a:0000 is `55 89 e5 31 c0 9a df 04 f5 01`, which is that sequence with the fixup applied. Under /$S- the same procedure goes straight into its body and emits no call at all. The probe's second routine is what makes it a measurement rather than a coincidence: WithLocals, which declares 402 bytes of locals, compiles under /$S+ to `55 89 e5 b8 92 01 9a ... 81 ec 92 01` -- mov ax,0x192, the call, then sub sp,0x192. So the operand is the frame size and the `xor ax,ax` in 118a is a frame size of zero, which is correct for routines that take parameters and declare no locals. A fixed prologue call would not vary. CONSEQUENCE FOR THE BUILD: none, and that is the useful part. $S+ is TPC's own default, so build.toml -- which deliberately asserts no code-generation switch -- already emits this prologue. The switch line was unverified and is now verified for $S. $G and $N remain unmeasured. AND GOLDPLAY WAS COMPILED $S-: segment 1160's routines have a frame but no 04df call anywhere in the segment's far-call list. It is a build input, linked as a prebuilt .TPU rather than recompiled, so its switches are not ours to match -- but the contrast is what made the prologue worth probing. The other four candidate names -- 023f GetMem, 0f36 FillChar, 0254 FreeMem, 0565/056a the text-file assign and open pair -- remain INFERENCES from call shape. rtl.py find is what would confirm them and it needs an RTL.toml naming a reference part, which this target does not have."

[[plan.investigation]]
name = "original-is-g-plus"
finding = "THE ORIGINAL WAS COMPILED /$G+, and the default is measurably wrong. Every framed routine in 118a tears its frame down with `c9` -- LEAVE, which is an 80186/286 instruction and does not exist on an 8086. probes/STACKCHK.PAS through codegen.py settles what emits it: /$S+ alone gives `5d` (POP BP) for a routine with no locals and `89 ec 5d` (MOV SP,BP; POP BP) for one with locals, and adding /$G+ changes exactly ONE byte in the whole probe, `5d` to `c9`. Nothing else in 128 bytes moves. So build.toml now says /$G+ /GD /Q. This is the opposite case to $S and the pair is worth keeping together: $S+ is TPC's default AND what the original shows, so naming it would add a switch that changes nothing; $G+ is NOT the default and IS what the original shows, so leaving it out would have made every framed routine in the reconstruction differ in its last two bytes. build.py's warning is exact -- a wrong switch line does not fail, it produces a build that measures wrong. $N is the one code-generation switch still unmeasured; fpusites.py settles it and needs a linked image."
state = "resolved"
resolution = "Asserted in build.toml with the probe cited beside it, and confirmed by the result it made possible: SCREEN.PAS compiles to the original's bytes, LEAVE included. See screen-unit-transcribed."

[[plan.investigation]]
name = "screen-unit-transcribed"
finding = "src/SCREEN.PAS IS WRITTEN AND ITS CODE IS THE ORIGINAL'S BYTES. units.py reports `identical, 46 pending fixups` over the declared 139 bytes on the FIRST build. The 46 forgiven bytes were checked independently rather than taken on the instrument's word, because 46 of 139 is a third of the unit and that is a lot of forgiveness to accept unexamined. Every one of them is ZERO on our side, they fall in 15 runs of width 2 or 4 only, and they account for themselves exactly: EIGHT four-byte far pointers -- df04f501 four times, which is the stack check once per framed routine, plus 3f02f501 GetMem, 360ff501 FillChar, 5402f501 FreeMem and 550df501 the initialisation's call -- and SEVEN two-byte DGROUP offsets, 1e35 four times for Virtual's offset, 2035 twice for its segment and 423b once for VirtualSeg. 8x4 + 7x2 = 46. Nothing else differs. TWO RISKS WRITTEN INTO THE SOURCE BEFOREHAND BOTH CAME OUT RIGHT, which is worth recording because either would have looked like a transcription defect: `xor si,si` and `xor di,di` have two encodings each and the original uses 31 f6 / 31 ff, which is what Borland's assembler chose; and the frame teardown needed /$G+ to emit LEAVE, which is why original-is-g-plus was measured first. WHAT IS NOT YET TESTED: the variable ADDRESSES. Our .TPU carries zeros where the original carries 1e35, 2035 and 423b, so the DGROUP offsets are supplied by the linker and nothing has compared them. dsmap.py is the instrument and it needs a linked image, so it waits on the program. See screen-dgroup-gap-unexplained. The register now locks coverage at 5 targets, risen from 0. All five are R0 -- a target with no measured rung -- because routines.py measures a LINKED image and there is no program to link yet."
state = "resolved"
resolution = "The unit is done to the limit of what a .TPU can prove. It goes no further until the program exists: a unit's code can be byte-exact while every address the linker fills is wrong, and only a linked image can tell."

[[plan.investigation]]
name = "screen-dgroup-gap-unexplained"
finding = "0x622 BYTES BETWEEN TWO VARIABLES THAT NOTHING DECLARES. The original puts Virtual's four bytes at DS:$351e/$3520 and writes the segment half to DS:$3b42, and SCREEN.PAS declares exactly those two variables and nothing between them. Turbo Pascal allocates a unit's variables in declaration order, so if both belong to this unit there are 0x622 bytes here that no declaration accounts for. Three readings and none is settled: this unit declares something between them that no instruction touches, so no disassembly can see it; or $3b42 is not this unit's variable and the write reaches a global another unit exports; or the two sit in different units' variable blocks. The third is not idle -- Crt's own globals were read at $3b4a, $3b4c, $3b4e, $3b52, $3b53, $3b54, $3b58 and $3c58 while identifying that unit, and $3b42 sits eight bytes below the lowest of them. DO NOT GUESS A FILLER ARRAY TO CLOSE IT. dsgaps.py sorts the DS:$ addresses a project's own source comments record and prints the gap to the next, which IS the size of whatever sits at the first -- it measures the ORIGINAL and needs no build. dsmap.py pairs every absolute data reference with ours and reports the shift, where a run of one non-zero shift names the declaration before it as the wrong size; that one needs a linked image. The source carries this note at the point of use so nobody closes the gap by arithmetic."
state = "resolved"
resolution = "SETTLED AND DECLARED. dsmap.py reported 88 sites at shift zero up to Virtual at DS:$351e and all 47 at DS:$3b42 and above at exactly -1568, so the missing declaration is between those two variables and is 1568 bytes wide. Declared in SCREEN.PAS as Unread3522, a byte array of the measured size, named for its provenance because a load image can say where it was and how big and nothing else -- no instruction in either file touches it. dsmap now reports 163 sites at shift zero across DS:$0003..$3DA4, the whole data group in the right place. The old note's figure of 1572 was arithmetic: subtracting the two addresses without allowing for Virtual being four bytes wide. And one of its three candidate explanations -- that VirtualSeg might belong to another unit -- was wrong. A boundary from the instrument beat several ticks of reading around the addresses, which is what dsmap's own docstring says it would."

[[plan.investigation]]
name = "goldplay-unit-rebuilt-from-source"
finding = "GOLDPLAY.TPU WAS THE ONE BUILD INPUT THAT COULD NOT BE REBUILT, and it is not any more. goldplay/v1.00 ships GOLDPLAY.DOC, .OBJ, .OVL, .TPU, PLAY.ASM and TESTPLAY.PAS -- no goldplay.pas -- so `uses GoldPlay` resolved only against a prebuilt unit staged by build.toml's `alongside`, and a clean checkout without goldplay/ could not link. src/GOLDPLAY.PAS now reconstructs the unit and the shipped TPU is no longer staged."
state = "resolved"
resolution = "RECONSTRUCTED FROM v1.01's SOURCE AND MEASURED AGAINST v1.00's TPU. The base is goldplay/v1.01/goldplay.pas, the nearest release that ships source; the target is the 672-byte code block at GOLDPLAY.TPU+0x3c0, whose position is located by align.locate against segment 1160 of ref/softel.bin rather than assumed. Compiled as-is under the project's switch line, v1.01's source reproduces the first 128 bytes and then parts -- 444 of 672 differing. THREE CHANGES CLOSE IT, each read off the bytes. (1) $B+, complete boolean evaluation: v1.00 materialises the guard in StartPlaying, StopPlaying and DeAlloc as `cmp word [Error],0; mov al,0; jne +1; inc ax; and al,[PlayerLoaded]; or al,al; je`, where the default $B- short-circuits the same expression into two compares and two jumps, which is what v1.01 emits. That took 128 identical bytes to 237. (2) THE GUARD'S TERM ORDER IS REVERSED. v1.01 reads `(PlayerLoaded) and (Error=0)`; the byte AND above takes PlayerLoaded as its MEMORY operand, so it is the second term and Error the first. Under $B+ the order is visible in the bytes, which is the same lesson as term order in PutGlyph. (3) $I+ at Reset: v1.00 carries a five-byte I/O result check after `Reset(F,1)` in LoadOVL -- a far call with nothing pushed -- and none after Assign, which cannot set IOResult. build.toml asserts /$I- for SOFTEL.PAS's sake, so the unit turns checking back on itself; the {$I-}/{$I+} pair already in v1.01's body is left alone and is what suppresses the eight BlockRead checks while restoring the one on Close. That is why only ONE call was missing rather than two -- a source directive overrides the command line from the point it appears. WITH ALL THREE: 672 of 672 identical. THE END-TO-END CHECK IS THE POINT, not the unit diff. build.toml now stages nothing alongside, lists GOLDPLAY.PAS first in [order] so the segment order 1160/118a is preserved, and wipe_tpu is BACK ON -- the setting existed only to stop `del *.TPU` deleting the irreplaceable input, and nothing staged is irreplaceable now. Rebuilt: md5 7c4350cb3e664c942149feef990f3801, artefact.py --check R7 holds, mapcmp 5 units exact, spans 11952 of 11952. units.toml gains a [unit.GOLDPLAY] row at segment 1160, length 671, so the check is standing rather than a one-off. WHAT THIS DOES NOT ESTABLISH: that v1.00's own source read this way. The interface and the private identifiers are v1.01's; only the generated code is measured, and a different source emitting the same bytes would fit the evidence equally. The file says so in its own header. CONSEQUENCE FOR goldplay-tracking-deferred: that row's argument rested on the TPU being an irreplaceable input, and it is not one. goldplay/ IS NOW NEEDED BY NOTHING, and that is measured rather than reasoned: with the whole directory moved off the disk, build.py compiles all three targets, artefact.py reports R7 holds, units.py reports GOLDPLAY 671 identical and SCREEN 139, mapcmp gives 5 units exact and spans 11952 of 11952. The verification target is ref/softel.bin, which is tracked, NOT the TPU -- units.py compares a built unit against the original IMAGE. A first statement here that goldplay/ was still needed to build was wrong and was corrected by that test; no config path has pointed into goldplay/ since `alongside` was emptied, and every surviving mention of it in a tracked file is prose. So a clean checkout builds: ref/softel.bin, bin/ and src/ are all tracked, and goldplay/ is now purely the evidence trail for how GOLDPLAY.PAS was derived and for the OVL md5 comparison, both already recorded here with their md5s. TWO PROCESS SLIPS worth keeping. A `{$B+}` quoted inside a `{ }` comment CLOSED the comment -- TP comments do not nest -- and paslint caught it and refused the build; the directives in that header are written without braces. And the iteration harness reported IDENTICAL off a STALE PROBE_tp6.TPU after that failed compile, because it checked for the file's existence rather than deleting it first. That is exactly what units.toml's `sources` key guards against for the real build, and a scratch harness had no such guard."

[[plan.investigation]]
name = "goldplay-tracking-deferred"
finding = "DEFERRED DELIBERATELY, and left untracked rather than gitignored, so that git status keeps asking. Recorded because the licence research behind it should not have to be redone. goldplay/ is 297K and untracked. GOLDPLAY.DOC states v1.00 is SMILEWARE: shareable on three conditions -- credit the authors, make NO CHANGES TO THE PACKAGE, and send them a postcard -- so redistribution is permitted, and the no-changes clause argues AGAINST cherry-picking GOLDPLAY.TPU out of the directory, which was the obvious small-footprint option. v1.00 SHIPS NO goldplay.pas. Its files are GOLDPLAY.DOC, .OBJ, .OVL, .TPU, PLAY.ASM and TESTPLAY.PAS -- the last is the example program, not the unit. So GOLDPLAY.TPU cannot be rebuilt from source and is an irreplaceable build input the moment the program says `uses GoldPlay`. v1.01 does have goldplay.pas, but the demo shipped v1.00 and the two differ. v1.01 is pure reference EXCEPT that it was load-bearing for one measurement: bin/SOFTEL.OVL is byte-identical to v1.00's GOLDPLAY.OVL (md5 1171f00214f6f1fcad96e704c6a71c0d) and NOT to v1.01's (md5 d07ce9460102d9312bf7736af622e811). Both md5s are recorded here and in overlay-is-stock-goldplay, so dropping v1.01 leaves that finding re-readable and re-checkable against a fresh download rather than only asserted. WHOEVER MAKES THE FIRST COMMIT: do not `git add -A`. goldplay/ appears as untracked and that is its current intended state, not an oversight."
state = "open"

[[plan.investigation]]
name = "ghidra-not-tracked"
finding = "ghidra/ IS DELIBERATELY NOT UNDER SOURCE CONTROL, and this row exists because the reasoning was originally written only into a commit message that was then rewritten away. IT WAS TRACKED FOR FOUR COMMITS: 1.75M, of which 1.75M was two 917504-byte Ghidra buffer files. Those two are not a duplicate pair somebody could trim -- db.1.gbf and db.2.gbf differ, and both are live buffer files of one database. The reason to drop them is what the database CONTAINED: 0 functions and 1 symbol. Auto-analysis had never been run and no person had annotated anything, so every tracked byte was derived from bin/SOFTEL.EXE -- 12832 bytes -- plus the MZ loader's defaults. It is also mutating while Ghidra is open. Softel.lock was held by a live instance the whole time, and a third file of exactly 917504 bytes (tmp*.ps) sat beside the two, so the commit captured a snapshot of files somebody else had open. NOTHING WAS LOST, because everything read out of Ghidra was already text: the memory map in link.toml, target.first_para in kit.toml, the segment identifications and the withdrawn readings in this register, and the instruction-level readings in src/SCREEN.PAS's [re] comments. TO RECREATE IT: import bin/SOFTEL.EXE as x86:LE:16:Real Mode and accept the MZ loader's defaults, which place the load image at 1000:0000 -- that is where first_para comes from. Do not trust the block boundaries it draws; they are 16 bytes out, which load-image-segment-map records. THE STANDING PREFERENCE: if annotation ever accumulates in Ghidra, move it into the sources as @asm markers and [re] prose rather than tracking the database. A marker is read by markers.py and locked by the ratchet; a .gbf is read by nothing and diffed by nothing. The history was rewritten to drop the blobs rather than merely untracking them, which was safe because this repository has no remote and nothing had been published."
state = "resolved"
resolution = "ghidra/ is in .gitignore, CLAUDE.md carries the recreation recipe and the block-boundary warning, and the four commits were rebuilt without the blobs so no history claims ghidra was ever tracked. The working project on disk was never touched."

[[plan.investigation]]
name = "program-routine-map"
finding = "SEGMENT 1000 IS DECOMPOSED: 15 routines of its own, a block of string constants, and a main body. Mapped from the segment's own near-call targets (E8 rel16 landing inside 0x1600) and its length-prefixed string constants, so every boundary below is the binary's rather than a reading. THE BODY IS AN UNROLLED SEQUENCE. Three routines carry the demo and each is called at a REGULAR STRIDE from the main body, which is what says the source is a straight-line list of statements rather than a loop: 04a1 twenty-two times from 10e2 at stride 0x24, 05e0 twenty-two times from 10f4 at the same stride and interleaved with it, and 07c0 seventeen times from 1452 at stride 0x14. Each call is preceded by the same six-instruction shape -- lea di,[bp-N] / push ss / push di / mov di,STRING / push cs / push di / lcall 01f5:096d -- which is a string constant being copied into a local before the call. STRING CONSTANTS occupy 048e..0f93, immediately below the entry point at 0f94. Thirty-four of them are exactly 18 characters and are the BBS advert lines; the rest are longer credit and e-mail lines. NOTE THAT THE LONG ONES ARE NOT CLEANLY SEGMENTED by a length-byte scan -- a maximal non-overlapping pass merges neighbours, so the 18-character table is reliable and the long table is not. Do not transcribe the long strings from that scan; read each length byte. THE PROGRAM'S GLOBALS, so far: three Bytes at DS:$3370, $3371 and $3372 set to 0, 0 and 1 before anything else; a Char at $3374 holding the music answer; three heap pointers at $329a/$329c (GetMem 0x3a80 = 14976), $3294/$3296 (GetMem 0xfa00 = 64000) and $46/$48 (GetMem 0x3b00 = 15104); and a Word at $3298 holding Seg of the 64000-byte buffer. GoldPlay's Error is the Word at $3376. THE OPENING IS TESTPLAY.PAS. System init, Crt init, Screen init, then ClrScr, Write('Do you want music? (y/n) : '), a ReadKey/UpCase loop until the key is in a two-character constant, echo, WriteLn, and if it was 'Y' then LoadOvl('softel.ovl'), AskInit, Initialize, LoadModule('patega.mod'), and on Error<>0 a WriteLn('Module Not Found') and Halt. GoldPlay's entry points are therefore 0160:00ce LoadOvl, 0160:0000 AskInit, 0160:0010 Initialize, 0160:0022 LoadModule and 0160:007d StartPlaying, which agrees with the order TESTPLAY.PAS calls them in."
state = "open"

[[plan.investigation]]
name = "rtl-and-crt-entry-points"
finding = "A CALL TABLE FOR THE RUNTIME AND Crt, read off argument shapes at the call sites rather than from bodies. Each is an INFERENCE and the confidence differs per row; rtl.py find is what would confirm any of them, and it needs an RTL.toml this target does not have. They are recorded because the same targets recur dozens of times and re-deriving them per call site is the waste this row prevents. Crt (segment 0193): 01c0 ClrScr -- no arguments, called before the prompt and again after it. 030d ReadKey -- no arguments, result taken in AL and fed to UpCase. 02fb KeyPressed -- no arguments, result tested with `or al,al`, called 8 times and always as an early exit. Screen (segment 018a), already transcribed in src/SCREEN.PAS: 0000 Blit, 0024 SetGraphicsMode, 002a OpenVirtual, 005e CloseVirtual, 007a its init. GoldPlay (segment 0160): 0000 AskInit, 0010 Initialize, 0022 LoadModule, 007d StartPlaying, 00ce LoadOvl. Confirmed by ORDER as well as arity -- the body calls them in exactly the sequence TESTPLAY.PAS does. System (segment 01f5): 00e9 Halt, called with ax=0. 023f GetMem and 0254 FreeMem and 0f36 FillChar, already recorded. 0848 WriteLn, 086c the write terminator, 08b5 Write of a Char, 0917 Write of a String -- all four taking the text file at DS:$3c58, which is Crt's Output. 0c22 a membership or position test over a two-character constant, driving the `until` of the ReadKey loop. 0f4a UpCase. 0f13 Move, three arguments, seen moving 5508 bytes from DS:$078c to DS:$1d10 -- two adjacent arrays whose gap is 0x1584, exactly the count. 096d and 0987 are BOTH string copies and the difference matters: 096d takes (dest, src) and appears before every display call, copying a code-segment constant into a local; 0987 takes (dest, src, 255) and is what a String value parameter's prologue uses. 04a1, THE FIRST DISPLAY ROUTINE, in outline: `enter 0x208` for 520 bytes of locals; the String parameter at [bp+4] copied into a 256-byte local via 0987, so its signature is procedure(S : String); an early exit if KeyPressed or if the Byte at DS:$3371 is non-zero; two Byte locals set to 1; a second local String primed from the 18-blank constant at 048e; the 5508-byte Move; then a loop that takes S[i] into the second string one character at a time, calling 03ae, then 0231 with @DS:$004a, then Screen.Blit(VirtualSeg, the Word at DS:$3298). Note there are TWO 64000-byte buffers -- Screen's own from OpenVirtual and the program's own from GetMem at 1084 -- and Blit moves between them."
state = "open"

[[plan.investigation]]
name = "softel-dat-layout"
finding = "softel.dat IS FULLY ACCOUNTED FOR, and the arithmetic closes to the byte. 1000:070f is its loader: Assign(F,'softel.dat'), Reset(F,1) as an untyped file, then six BlockReads and Close. The six sizes are 210 into DS:$329e, 5508 into DS:$078c, 14976 through the pointer at DS:$329a, 64000 through the pointer at DS:$351e -- which is Screen.Virtual, so the background picture is read straight into the virtual screen -- 768 into DS:$004a, and 15104 through the pointer at DS:$0046. 210+5508+14976+64000+768+15104 = 100566, and bin/SOFTEL.DAT is 100566 bytes. Nothing is left over and nothing is short. WHAT EACH BLOCK IS, each confirmed by the routine that reads it rather than by its size alone: the 210 is a 15x14 sprite, because 1000:0095 draws exactly 15 columns by 14 rows from it with zero as transparent, and 15x14 = 210. The 5508 is a 306x18 text strip, because 1000:03f5 writes into it with a stride of 306 and 306x18 = 5508. The 14976 is an animation path table of 72 frames at 208 bytes each -- 72x208 = 14976 exactly -- and 1000:013e walks 51 objects per frame at 4 bytes each, taking a word pair as a coordinate. The frame counter at DS:$3372 cycles 1..0x48, which is 72. The 64000 is the 320x200 background. The 768 is a VGA palette, 256 entries of three bytes, which 1000:01ca walks 0..255. The 15104 is a 16x16 font, indexed by character times 0x100, so 15104/256 = 59 glyphs."
state = "resolved"
resolution = "Read from the loader, not guessed from the file. The total is the check: any wrong size would have to be compensated by another wrong size to still sum to 100566."

[[plan.investigation]]
name = "program-routines-read"
finding = "ALL FIFTEEN ROUTINES OF SEGMENT 1000 ARE READ. Ghidra's decompiler was used for this and earns its place: it handles the 16-bit segmented code well and is far faster to read than a linear decode. ONE TRAP IN USING IT -- it prints arguments in REVERSE of push order, so FUN_118a_0000(0x3298,0x3b42) is Pascal's Blit(VirtualSeg, BufSeg). Every argument order below is already un-reversed. 0000 WaitRetrace -- polls port $3DA for bit 3 low then high. 000e a palette fade-DOWN step: for colours 1..255 decrement each of r,g,b that is greater than 1, and return whether anything changed. One call, from 1406, so it is the fade at the very end. 0095(dest, sprite, y, x) draws the 15x14 sprite, zero transparent, into a 320-stride buffer. 00f0(dest, strip, y, x) blits the 306x18 text strip in -- 0x99 words by 0x12 rows, destination stride 0x140. Called as (7, 20), so the strip lands at x=7, y=20 of the 320x200 buffer. 013e(frame) draws one animation frame: 51 objects, each a word pair read from the path table at frame*0xd0 + i*4. 01ad(colour, r, g, b) sets one palette entry. 01ca(pal) sets all 256 by calling it in a loop. 0231(pal) IS THE PALETTE CYCLER AND THE DEMO'S CLOCK. It Moves 576 bytes of the palette down by 18 -- six colours -- rewrites the six that fell off the end from saved copies, or FillChars them to zero instead when the Byte at DS:$3370 is set, sets DS:$3371 when pal[3..5] have reached zero, then WaitRetrace and SetPalette. So $3370 means a key was pressed, $3371 means the fade has finished, and $3371 is what every display loop tests to exit. 038b a five-argument block-move helper, used only by the scroller. 03ae scrolls the background up three scanlines and WRAPS: it saves 960 bytes from VirtualSeg:$0140 to DS:$03cc, block-moves 31360 bytes down, and writes the saved 960 back at VirtualSeg:$f500. 03f5(x, ch) draws one 16x16 glyph into the text strip, skipping zero pixels so glyphs are transparent. 04a1(S : String) and 05e0(S : String) are the two line displays and are MIRROR IMAGES: both copy the parameter to a local, exit early if KeyPressed or $3371, prime a second local from an 18-blank constant (048e for one, 05cd for the other), Move 5508 bytes from $078c to $1d10 to reset the strip, then loop -- scroll, cycle the palette, blit the strip, draw a glyph, advance the frame counter, Blit to $A000. 04a1 walks its x position from 0 upward by 0x11 and runs until its counter hits 0x32; 05e0 starts at 0x121 and walks DOWN by 0x11. So one line flies in from one side and the next from the other, which is why the body interleaves them. 070f loads softel.dat -- see softel-dat-layout. 07c0(S : String, y) IS THE TEXT-MODE FINALE and uses Crt rather than the virtual screen: it counts the non-space characters, then repeatedly picks a random position with Random, and for each non-space character walks it up from row 0x18 to row y using GotoXY and Write with a Delay(5) per step, blanking the trailing cell as it goes. That is why Crt is linked at all and why the long credit strings exist. NEW ENTRY POINTS NAMED BY THIS: Crt 0213 GotoXY and 029c Delay; System 0cce Random, 0d62 Assign, 0d90 Reset, 0e7b BlockRead, 0e11 Close, 0955 a fixed-size copy used for array value parameters."
state = "open"

[[plan.investigation]]
name = "dgroup-addresses-observed"
finding = "A MAP OF DGROUP FROM THE INSTRUCTIONS THAT REACH IT, which is what screen-dgroup-gap-unexplained needs: dsgaps.py prices declarations against the original but only knows the addresses a source records, and this project had recorded two. Observed, with what reads or writes each: $0046 a pointer to the 15104-byte font; $004a a 768-byte palette; $034c the untyped file variable; $03cc a 960-byte scroll save; $078c the 5508-byte text strip that is the RESET copy; $1d10 the 5508-byte strip that is DRAWN into -- and $1d10 minus $078c is 0x1584 = 5508, so the two are adjacent and the Move between them is exactly one strip; $3294 a pointer to the 64000-byte work buffer with $3298 holding its segment; $329a a pointer to the 14976-byte path table; $329e the 210-byte sprite; $3370 the key-pressed flag; $3371 the fade-finished flag; $3372 the frame counter; $3374 the music answer Char; $3376 GoldPlay's Error. Screen's own are $351e and $3b42, and Crt's were read at $3b4a, $3b4c, $3b4e, $3b52, $3b53, $3b54, $3b58 and $3c58. DO NOT DERIVE THE LAYOUT FROM THIS. Taking the program's own run as contiguous puts its variables at $0046..$3377, which would place Screen's $351e INSIDE that range and GoldPlay's $3376 at its very end -- two orderings that cannot both be right. Turbo Pascal allocates per unit in link order and the run above is not necessarily one block. dsmap.py is the instrument that settles it by pairing every absolute reference with ours and reporting the shift, and it needs a linked image. Record these addresses in the sources as they are written and let the tools price them."
state = "open"

[[plan.investigation]]
name = "softel-pas-first-link"
finding = "src/SOFTEL.PAS IS WRITTEN AND THE PROGRAM LINKS. mapcmp reports THREE of five units exact: GOLDPLAY 672 of 672, SCREEN 144 of 144, Crt 1568 of 1568. System is 336 short and out of scope. The only in-scope gap is SOFTEL itself, 2240 bytes, which is the seven routines declared with empty bodies. SEGMENT ORDER MATCHES, and the rule behind it is measured. Turbo Pascal 6 emits unit code segments in the REVERSE of the program's uses clause: written Crt, GoldPlay, Screen the map came out SCREEN, GOLDPLAY, CRT against an original of GOLDPLAY, SCREEN, CRT, and reversing the clause to Crt, Screen, GoldPlay put all three where the original has them. The same clause independently predicts the startup's init calls -- the image calls Crt's init then Screen's, in clause order, and GoldPlay has no init. TWO MORE SWITCHES SETTLED BY THIS, both by a failure rather than by reasoning. /$X+ is asserted because at 1000:15a8 the image calls Crt.ReadKey and stores the result nowhere, which only extended syntax permits; written $X- the keyboard drain 'while KeyPressed do ReadKey' does not compile at all, which is the good kind of failure. GOLDPLAY's segment then went from 0x228 to 0x29f -- exactly the original's code length -- once the tail was written, because smart linking keeps only what is reached and four missing calls had been showing up as a short segment rather than an error. THE TAIL IS TESTPLAY.PAS AGAIN, and it also solved a variable. 1000:159a onward is WriteLn, a keyboard drain, then -- if the music was taken -- the volume walked from 64 down to 0 with Delay(50) a step, then StopPlaying, DeAlloc, RemoveOvl, and an inline int 10h restoring the cursor. That is TestPlay's ending almost word for word, and its loop counter is the Word at DS:$034a that this project had recorded as an unexplained two-byte gap between the palette and the file variable. It is TestPlay's own Var I:Word, declared exactly where TestPlay declares it. GoldPlay's four remaining entry points are 0278 MasterVolume, 0098 StopPlaying, 00b3 DeAlloc, 025e RemoveOvl. THE ADVERT IS ONE repeat LOOP. 13e9 jumps back to 10d3, the FIRST of the 44 text calls, so they are statements inside repeat ... until KeyPressed or Faded, which is why the image has them unrolled. A WIPE HAD TO BE TURNED OFF, and the reason belongs with the build. build.py writes 'del *.TPU' into BUILD.BAT so a failed compile cannot be measured against a stale unit, but that runs inside DOSBox AFTER staging and deleted the staged GOLDPLAY.TPU -- a build input that cannot be regenerated, since v1.00 ships no goldplay.pas. It presented as 'File not found (GOLDPLAY.TPU)' on the uses clause, which reads as a missing file rather than a deleted one. wipe_tpu is false here with that written down; the real guard is units.toml's sources key, which makes units.py refuse a stale build. A kit fix would exempt staged inputs from the wipe. STILL EMPTY, and the register says so rather than implying it: PutSprite, PutStrip, SetRGB, MoveBlock, ShowLine, ShowLineReverse, FlyCredit."
state = "open"

[[plan.investigation]]
name = "extraction-by-backward-opcode-scan"
finding = "A SCAN THAT READ A STRING'S OWN BYTE AS AN OPCODE, and it put a wrong line in a draft of the source. Extracting the display-call sequence needs the mov di,imm16 that precedes each call, and the first attempt searched BACKWARDS from the call for a 0xBF byte. At 1000:126e the string operand is 0x0abf, whose LOW BYTE IS 0xBF -- so the scan hit the operand before the opcode and read the following two bytes as the address, reporting 0x0e0a. That is a real string constant elsewhere in the segment, one of the long credit lines, so the output was plausible: it put a fragment of an e-mail address into the middle of the BBS advert, between 'LATEST VERSION OF ' and the '####' separator. Nothing about the run said it was wrong. It was caught only by reading the region in a disassembler because two consecutive calls to the same routine looked odd. THE FIX IS TO ANCHOR ON THE WHOLE INSTRUCTION SEQUENCE, not on one opcode byte: the call sites share a fixed 15-byte prologue -- lea di,[bp-imm8], push ss, push di, mov di,imm16, push cs, push di, lcall 01f5:096d -- and matching all of it cannot land inside an operand. Re-run that way it found 61 sites split 22/22/17, agreeing with counts derived independently from the near-call target census. The true string at 126e is 0x0abf, 'PC-BOARD (V 15.0) ', which reads correctly after 'LATEST VERSION OF '. THE GENERAL RULE, and it holds for any variable-length instruction set: a backward byte scan for an opcode is unsound whenever an operand can take the opcode's value, and x86 is dense enough that it usually can. The failure is silent and the wrong answer is drawn from the same population as the right one, so it looks like data rather than like a bug. Also worth keeping: the maximal non-overlapping length-byte scan used earlier MERGED neighbouring string constants, so the long credit strings in that table were wrong too. Reading each length byte at the address the code actually loads gives clean strings. Two different scans, two silent mis-segmentations, both from trusting a pattern over the instruction stream."
state = "open"

[[plan.investigation]]
name = "call-site-string-temp"
finding = "EVERY CALL SITE IN THE ORIGINAL IS TEN BYTES LONGER THAN OURS, and this is now the whole remaining gap rather than missing code. All fifteen routines are written and mapcmp has SOFTEL at 5408 of 5632, short 224. But the parts have moved in opposite directions: our ROUTINES are collectively about 400 bytes LONGER than the original's, and our main BODY is about 588 bytes SHORTER. The body is where the 61 display calls live. THE TWO SHAPES. Ours, for LoadOvl('softel.ovl'), is eight bytes: mov di,CONST / push cs / push di / lcall LoadOvl. The original is eighteen: lea di,[bp-0xc] / push ss / push di / mov di,CONST / push cs / push di / lcall 01f5:096d / lcall LoadOvl -- and NOTHING is pushed between 096d and the call, so 096d must leave four bytes behind as the callee's argument. WHAT IT IS NOT. It is not the parameter type: goldplay/v1.01/goldplay.pas declares `Procedure LoadOVL(FNamn:String)`, a plain String, exactly as ours resolves. And it is not a plain copy into a string temporary -- the destination for the 18-character advert lines is [bp-0x14], and the next local is the filename temp at [bp-0xc], so that region is at most EIGHT bytes wide. An 18-character string needs nineteen. Whatever 096d builds there, it is not the string. Eight bytes is the size of a far pointer plus a word or two, which is the shape of a descriptor rather than of a value. WHY IT MATTERS OUT OF PROPORTION TO ITS SIZE: there are 61 of these call sites plus the GoldPlay ones, so a ten-byte difference each is most of the 224 and it is a single cause. Getting it right closes the gap in one edit; guessing at it changes 61 sites at once in the wrong direction. HOW TO SETTLE IT -- a probe, not an argument. codegen.py exists to put a construct in a probe unit and compare what compilers emit, and the toolchain is proven. Compile a unit declaring a procedure that takes a String value parameter, call it with a literal, and read what the call site emits; then vary the one thing at a time -- the parameter declared as a short String[n], the argument as a variable rather than a literal, and the $V switch, which is the only remaining string-related switch this project has not measured. One of those produces the eighteen-byte form."
state = "resolved"
resolution = "SUPERSEDED by strconst-temp-helper-096d and by the temp-size measurement recorded there. The short version: the difference is the original's COMPILER materialising each string constant into a stack temporary sized to that constant, and no source shape or switch reachable here reproduces it."

[[plan.investigation]]
name = "strconst-temp-helper-096d"
finding = "01f5:096d IS READ, BOTH CALL SITES ARE READ, AND THE CAUSE IS STILL OPEN. Recorded because three hypotheses are now eliminated BY MEASUREMENT and the next person should not re-run them. WHAT 096d IS, exactly: cld / mov bx,sp / mov dx,ds / les di,ss:[bx+8] / lds si,ss:[bx+4] / lodsb / stosb / mov cl,al / xor ch,ch / rep movsb / mov ds,dx / retf 4. So it takes DEST (pushed first, at [bx+8]) and SOURCE (pushed second, at [bx+4]), copies the source's length byte and then that many bytes, and returns popping only FOUR -- the source. The destination pointer is left on the stack and becomes the following call's argument. It is UNBOUNDED: no maximum length is passed and none is checked. THE TWO CALL SITES, side by side. Original at 1000:10d3, eighteen bytes: lea di,[bp-0x14] / push ss / push di / mov di,0930h / push cs / push di / lcall 01f5:096d / call 04a1. Ours at 1000:124e in the built image, eight bytes: mov di,0a93h / push cs / push di / call 05a4. Both end in a callee whose prologue does the BOUNDED copy 0987 with 0ffh into a 256-byte local, which is what a `S : String` value parameter emits -- so the parameter type on both sides is a plain String and the difference is entirely in how the argument is prepared. ELIMINATED, each by a probe under probes/: a plain String parameter with a LITERAL argument pushes CS:offset directly, eight bytes (STRLIT.PAS PassLiteral); with a VARIABLE argument likewise (PassVariable); a short String[18] parameter moves the copy into the CALLEE and leaves the caller direct (STRSHORT.PAS); and assigning a literal to a local then passing the local emits a BOUNDED copy in the other argument order and then pushes the destination a SECOND time (STRVIA.PAS, both a short and a full-length local). None of the four is the original's shape. WHAT THE ELIMINATIONS SAY. Every construct tried uses a BOUNDED helper, so 096d's unbounded form is not reachable from any of them. The destination is a 20-byte region -- [bp-0x14], with the filename temp at [bp-0xc] sharing the same reused stack area -- which is too small for a 255-byte String and the right size for an 18-character one rounded up from 19. Those two facts pull in opposite directions and that is exactly why this is not yet settled: an unbounded copy suggests a destination that cannot overflow, and a 20-byte destination is not one. A SIDE NOTE WORTH KEEPING: TP6 refuses `S : String[18]` inline in a parameter list -- Error 89 -- so a short string parameter requires a named type. If the answer turns out to be a short parameter, the original's source declares a type for it. NEXT: $V is the one string-related switch still unmeasured, and OURS.EXE is now imported into the Ghidra project beside SOFTEL.EXE so the two bodies can be decompiled side by side rather than hand-disassembled a region at a time."
state = "open"

[[plan.investigation]]
name = "const-temps-are-sized-per-constant"
finding = "THE ORIGINAL'S COMPILER ALLOCATES A STACK TEMPORARY PER STRING CONSTANT, SIZED TO THAT CONSTANT, and the evidence is a exact match across seventeen independent lengths. Enumerating every `lea di,[bp-n]` in the main body against the frame it declares -- enter 042h, 66 bytes of locals -- gives these temps, and each one is the constant's length plus a length byte rounded up to even: bp-0x02 used once, for the single-space argument at 13f4; bp-0x0c twice, for 'softel.ovl' and 'patega.mod' at ten characters; bp-0x12 once, for the seventeen-character 'HST DS 16.8, FOR '; bp-0x14 FORTY-TWO times, for the eighteen-character advert lines; and then bp-0x2e, 0x30, 0x34, 0x36, 0x3a, 0x3e, 0x40 and 0x42 for the credits. THE CREDIT TEMPS ARE THE PROOF. Their seventeen lengths are 45, 46, 50, 52, 56, 56, 56, 57, 57, 60, 61, 62, 62, 62, 63, 63 and 64. Sorted into temps: 45 -> 46 (bp-0x2e, x1), 46 -> 48 (bp-0x30, x1), 50 -> 52 (bp-0x34, x1), 52 -> 54 (bp-0x36, x1), 56 and 57 -> 58 (bp-0x3a, x5), 60 and 61 -> 62 (bp-0x3e, x2), 62 and 63 -> 64 (bp-0x40, x5), 64 -> 66 (bp-0x42, x1). Every count matches the number of credit lines in that band, and the largest temp is exactly the 66-byte frame. Nothing about that is coincidence. SO IT IS COMPILER BEHAVIOUR, NOT A SOURCE CONSTRUCT. A source shape cannot choose a temp size per literal; a code generator can. And the copy helper it uses, 01f5:096d, is UNBOUNDED precisely because the temp is exactly the right size -- read that routine and it takes DEST then SOURCE, copies the length byte and that many bytes, and returns popping only four so the destination stays as the callee's argument. NOT REPRODUCIBLE HERE, and six variables were tested: TP6.0 and TP6.01 emit IDENTICAL code for the construct; TP7 INLINES 096d's body rather than calling it; $S, $G, $X and $V change nothing about it. Four source shapes were probed and all four pass the constant's address directly -- a String parameter with a literal, with a variable, a short String[18] parameter, and an assignment to a local followed by passing that local. The original's own Assign(F,'softel.dat') at 1000:0717 ALSO passes directly, so the compiler does both and the choice depends on something not yet identified. WHAT IT COSTS: ten bytes at each of 61 call sites, which is the whole of the body's -600 and therefore most of what separates this reconstruction from the original's size. Everything else is now within tens of bytes. WHAT TO TRY NEXT: another TP6 patch level, or Borland Pascal 7 in its TP6 compatibility mode. Only TP600, TP601, TP700 and TP701 are installed here and all four are eliminated. This is the one open question that a different binary of the compiler could settle in a single run."
state = "open"

[[plan.investigation]]
name = "local-order-scalars-first"
finding = "THE ORIGINAL DECLARES ITS SCALAR LOCALS BEFORE ITS STRING, and this reconstruction has it the other way round. In ShowLine the original writes its two flag bytes at bp-0x101 and bp-0x103 -- immediately below the value parameter's own 256-byte copy at bp-0x100 -- and puts its 256-byte working string at bp-0x208. Ours writes the same two bytes at bp-0x204 and bp-0x203, which is what a `var Line : String; X : Integer; N, I : Byte` order produces: Turbo Pascal allocates locals downward in DECLARATION order, so the order of the var block IS the frame layout. IT COSTS NO BYTES BY ITSELF -- both displacements are four bytes wide, so the instructions are the same length -- but it is a transcription fact, and it constrains the source: the original's var block opens with scalars. AND IT SAYS THERE ARE LOCALS WE HAVE NOT FOUND. The original's frame is enter 0208h = 520 bytes: 256 for the parameter copy, 256 for the string, and EIGHT for scalars. Three are accounted for -- the bytes at bp-0x101 and bp-0x103 and a word at bp-0x108 -- leaving four bytes declared and not yet seen used. Ours is enter 0204h, four short, which is exactly that. Do not pad the var block to close the gap: a declaration invented to match a frame size is a fact asserted with no evidence, and it would sit in the source looking measured. Find the uses first."
state = "open"

[[plan.investigation]]
name = "original-compiler-spills-to-temps"
finding = "THE REMAINING GAP IS THE COMPILER BUILD, NOT THE SOURCE, and three independent constructs say so. In each one the original allocates a stack temporary for an intermediate value and ours computes it in registers; the source shape is the same on both sides. ONE -- STRING CONSTANTS PASSED BY VALUE. The original copies each constant into a temp sized to that constant and passes the temp: eighteen bytes per call site against our eight. Every temp size matches its constant, across all seventeen credit-line lengths (see const-temps-are-sized-per-constant), so the code generator is choosing the size. Sixty-one call sites, ten bytes each, which is the body's whole -600. TWO -- SetPalette. Its original reserves six bytes of locals where ours reserves two, and the four extra hold a POINTER: its decompilation fetches the R component through that pointer while G and B come from direct indexing. That is what SetRGB(I, P[I][0], P[I][1], P[I][2]) emits if the compiler materialises @P[I]. Ours does not, and is three bytes shorter. THREE -- DrawFrame. Same signature: enter 6 against enter 2, and at +0x29 the original loads an address through the local where ours pushes the computed value straight. Ours is twelve bytes shorter. A source difference cannot produce that pattern three times in three unrelated places, and it cannot choose a temp size per literal. A different code generator can. BOTH INSTALLED TP6 BUILDS ARE ELIMINATED, and by a whole-program test rather than a probe: building all of SOFTEL.PAS with tp61 instead of tp6 gives the identical result -- the same six routines byte-identical and the same deltas on the rest, to the byte. TP7 is eliminated too; it INLINES the copy helper the original calls out to. That is TPC 6.0 of 23-Oct-1990 and 6.01 of 11-Jun-1991, both verified by size and date, plus 7.00 and 7.01. SO THE OPEN QUESTION IS NARROW AND ANSWERABLE: which Turbo Pascal 6 build spills these intermediates? Another 6.x patch level, a localised release, or Borland Pascal 7 in TP6 compatibility mode would settle it in one build. None is installed here. WHAT NOT TO DO: do not keep rewriting the Pascal to chase these bytes. Six routines are byte-identical, two more are size-exact and differ only at far-call fixups, the data group is wholly in place at 163 references, and every remaining delta has this one explanation. Rewriting the source to imitate a temp our compiler will not emit would make the source WRONG in order to make the bytes right."
state = "resolved"
resolution = "Left open as a question about the toolchain rather than the reconstruction. It blocks nothing else: the source is written, it builds, it links, and it measures. Resolving it needs a compiler binary this machine does not have."

