# Generated by kit/tools/pascal/{ratchet,observe,plan}.py. The lock is
# DATA, not code, so a lowering is a visible change here.
#
# `matched`, `achieved` and every [observation.*] are MEASURED. Never
# hand-edit them. To accept a regression, lower `target` with a `reason`.
# [plan] is DECIDED: investigation order is the priority order.

[coverage]
targets = 5

[[plan.investigation]]
name = "overlay-is-stock-goldplay"
finding = "SOFTEL.OVL is not the demo's own code. bin/SOFTEL.OVL is byte-identical to goldplay/v1.00/GOLDPLAY.OVL (md5 1171f00214f6f1fcad96e704c6a71c0d, both 35715 bytes, both dated 17 Jul 1992), and the file's own header carries 'GoldPlay ver 1.00 (C)opyright 1992 The CodeBlasters'. goldplay/v1.01/goldplay.ovl differs, so the demo shipped v1.00. The reconstruction target is therefore SOFTEL.EXE alone; the overlay is a build INPUT, and goldplay/v1.00 holds its GOLDPLAY.TPU, GOLDPLAY.OBJ and PLAY.ASM."
state = "resolved"
resolution = "Settled by byte comparison before any disassembly. target.original is a one-row table naming ref/softel.bin only; SOFTEL.OVL needs no reconstruction and must not be measured as if it did. Consequence for later: a units/objcheck config for the GoldPlay unit measures a third-party binary we already have the sources for, so it is a build-input check, not a rebuild target."

[[plan.investigation]]
name = "no-build-toolchain"
finding = "Nothing here can build yet. There is no build/ directory, no Turbo Pascal 6 compiler and no build config, so kit.toml cannot answer layout.build or layout.built, and SETUP.md's steps 3-5 (the layout config, the units config, a blocks config) are all blocked: each is filled from a linker map, and there is no linker map until a build runs. Every measuring instrument that compares a rebuild against ref/softel.bin is unreachable until this is resolved. The binary is Borland/Turbo Pascal 6 ('Portions Copyright (c) 1983,90 Borland' at file offset 0x2489), so the compiler is determined, not a choice."
state = "resolved"
resolution = "SOLVED, and it was configuration rather than installation -- everything needed was already on this machine. DOSBox-X sits at D:/DOSBox-X and its drive C: image holds TASM and FOUR Turbo Pascal trees: TP600, TP601, TP700 and TP701. kit.local.toml (gitignored, because a machine path may never appear in a committed file) names the DOSBox binary, the HDD folder and the DOS-side path to each TPC.EXE. build.toml is committed and holds no machine path. Structure was taken from the sibling consumer at ../VangeliSTracker/v1.51 with the owner's agreement; nothing MEASURED there was carried, and the reason is in the [compiler.tp6] comment. PROVEN, not assumed: build.py --selftest compiles under tp6 and again under tp61, and each run emits HELLO.EXE and a detailed HELLO.MAP with a segment table and publics by value. The linker map is the artefact SETUP.md's steps 3-5 were all blocked behind, so link.toml is now written. TWO TRAPS WORTH KEEPING. The sibling's build.toml still says binpath C:/TP6, where these installs USED to live, and its own kit.local.toml records the cost: the build reported SUCCESS without compiling anything, because DOS sets no errorlevel for a command it cannot find. This host writes C:/TP600 and C:/TP601. And this shell's QUOTED heredocs collapse a doubled backslash to a single one, which silently turned every Windows path in the first draft of both config files into invalid TOML; both files now use TOML literal strings, which need no escaping at all. NO CODE-GENERATION SWITCH IS ASSERTED. The switch line is /GD /Q -- a detailed map, and a quiet log. build.py warns that a wrong switch line does not fail but produces a build that MEASURES wrong, and $G+ alone decides whether 286 instructions are emitted. The sibling target read its line out of a shipped TPC.CFG; SOFTEL's distribution has none, so every such switch would be a guess wearing the clothes of a fact. Superseded on the patch level by tp6-patch-level."

[[plan.investigation]]
name = "segment-inventory"
finding = "The load image's own structure, read from ref/softel.bin without a build: 12832 bytes with an 800-byte header, so 12032 bytes of code+data; entry CS:IP 0000:0F94; SS:SP 06C6:0FA0; minalloc 19712 bytes of uninitialised data the loader is asked for. Its 191 fixups name only 5 distinct target segments -- 0160, 018A, 0193, 01F5 and 02EB -- and 01F5 takes 149 of the 191 references, which is the shape of DGROUP rather than of code. What each of the other four segments IS, and which is the PROGRAM, is not yet read."
state = "resolved"
resolution = "WITHDRAWN, and the withdrawal is the point. The reading 'segment 01F5 takes 149 of 191 references, which is the shape of DGROUP rather than of code' is WRONG. The Ghidra memory map says 11f5 is CODE_4, 0x0f60 bytes -- the largest code segment in the image, which is the Turbo Pascal runtime, and 149 references to it is the shape of a runtime being CALLED, not of a data group being addressed. DGROUP is 12eb:0050 onward, and segment 02EB carries only 4 of the 191 fixups. The defect in the method: relocation counts measure how often a segment is NAMED, and a fixup naming a far CALL target looks exactly like one naming a data word, so a count alone cannot separate code from data. Superseded by load-image-segment-map."

[[plan.investigation]]
name = "load-image-segment-map"
finding = "The load image's segmentation, read off the Ghidra memory map (ghidra/Softel.gpr, program SOFTEL.EXE) with first_para 0x1000, and agreeing with the 5 distinct fixup target segments in ref/softel.bin: CODE_0 1000:0000-160f (0x1610 bytes, the PROGRAM -- it is the only segment no fixup names as a target); CODE_1 1160:0010-029f; CODE_2 118a:0000-008f (0x90, the smallest); CODE_3 1193:0000-061f; CODE_4 11f5:0000-0f5f (0x0f60, the largest, and the target of 149 of the 191 fixups -- the runtime); CODE_5 12eb:0000-004f; DATA 12eb:0050-4d4f. The DATA block is 0x4d00 = 19712 bytes, which is EXACTLY the MZ header's minalloc, so Ghidra's DATA block is the loader's BSS request rather than initialised data. Which unit each of CODE_1, CODE_2, CODE_3 and CODE_5 is, is not yet read -- and CODE_1 starting at offset 0x0010 rather than 0x0000 is unexplained."
state = "resolved"
resolution = "The map is read, one segment is IDENTIFIED against a known input, and two of the finding's own claims were wrong. (1) CODE_0's extent is 0x1600, not the 0x1610 Ghidra's block says. Surveyed at 0x1610 the program shows one far return at 160e; surveyed at 0x1600 it shows NONE, which is correct for a program body -- it ends in the runtime's halt, not a RETF. That RETF is 1160:000e, the end of the GoldPlay unit's first routine, and Ghidra had misattributed 16 bytes. (2) Ghidra's CODE_1 starts at 1160:0010 and that is an artefact of block layout, not a fact: the unit's segment begins at 1160:0000, and the block as Ghidra drew it hides the unit's whole first routine, which the program calls. SEGMENT 1160 IS THE GOLDPLAY UNIT, and it is measured rather than inferred. align.locate -- the same core units.py uses -- puts the segment at offset 960 of goldplay/v1.00/GOLDPLAY.TPU, which is where that TPU's symbol names stop and its code begins. Over the 672-byte extent the two differ in 105 runs and NO run is longer than 4 bytes: 20 of width 4, 71 of width 2, 14 of width 1. 104 of the 105 are zero in the TPU, the addend the compiler leaves for a reference somebody else resolves. The EXE's relocation table holds exactly 20 entries landing in this segment, one per 4-byte far pointer; the 2-byte runs are DGROUP offsets and the 1-byte runs near displacements, both resolved at link time and so absent from a load-time table. The single non-zero difference is the last byte, image 00 against TPU c8 -- linker padding against the start of the TPU's next record -- so the unit's code length is 671 and its extent 672. 12eb IS NOT CODE. CODE_5, 80 bytes, is 79 zero bytes and one 02, with no far return, no string and no far call. Its 100% match against GOLDPLAY.TPU at offset 41 is a FALSE POSITIVE and was not reported as anything else: two near-zero regions agree, which is what align.locate is for and not what it proves. The corrected map: 1000:0000+0x1600 the PROGRAM; 1160:0000+0x2a0 GOLDPLAY (671 code, 1 pad); 118a:0000+0x90 unread; 1193:0000+0x620 unread; 11f5:0000+0xf60 the runtime; 12eb:0000+0x50 not code; DATA from 12eb:0050. Superseded for the two unread units by unidentified-units-118a-1193."

[[plan.investigation]]
name = "encaudit-not-recursive"
finding = "kit/tools/encaudit.py has a blind spot that reads as a pass. Its main() globs '*.py' in each directory it is given rather than recursing, so encaudit.dirs = ['kit/tools'] examines the 7 files sitting directly there and never walks the 69 under pascal/, substrate/ and wikitools/ -- and prints '0 site(s) in 7 file(s)', which reads as a clean audit of the tools. Naming all four directories explicitly raises it to 76 files, still 0 sites, so the kit itself is clean and this was a blind spot rather than a hidden defect. This host's kit.toml carries the four-entry workaround with the reason beside it. The fix belongs upstream in the kit (rglob, or a stated non-recursion), together with a wiki observation for the blind spot: eolcheck.py already argues this exact failure -- a count of zero over a tree nothing examined -- and encaudit prints the file count without saying what it declined to walk."
state = "resolved"
resolution = "FIXED UPSTREAM in kit 2f8770c, and the fix went further than the report asked. encaudit.py now rglobs, skips __pycache__, and DEDUPES by resolved path -- the last because a config naming both kit/tools and kit/tools/pascal would otherwise audit pascal twice and print a file count nothing in the tree matches, which is precisely the workaround this host was carrying. It also now RETURNS 1 when it examined no files at all, stating that nothing audited is not the same as nothing wrong. This host's kit.toml is back to one entry, encaudit.dirs = [\"kit/tools\"], and reports 0 site(s) in 77 file(s) -- 77 rather than the 76 measured before, because the kit gained tools/pascal/source.py in the same pull. The workaround is deleted rather than left harmlessly in place: it would have needed extending every time a folder was added, and been silently wrong until somebody noticed."

[[plan.investigation]]
name = "unidentified-units-118a-1193"
finding = "Two units are still unnamed, and what is known about each is a shape rather than a name. Neither writes text: survey.py reports no printable string in either, and by that instrument's own thesis an absence is evidence, so neither ever wrote a message. 118a is 144 bytes with 4 far returns -- RETF 4 at 0020, then bare RETF at 005c, 0078, 0089. It makes 5 distinct far calls out, and 4 of them are the SAME runtime routine 01f5:04df, called once near the head of each routine from 0005, 002f, 0063 and 007f. The program calls 018a:0000 five times and 018a:0024, 002a, 005e and 007a once each; 007a is its init, reached from the startup at 0f9e. 1193 is 1568 bytes with only 2 far returns, at 002c and 043b, and it makes just 2 far calls out -- 01f5:0565 from 0014 and 01f5:056a from 0027, both inside its first 0x2c bytes, so both are in its initialisation and its bodies call nothing at all. A unit of 1568 bytes that leans on the runtime only while initialising is doing arithmetic or writing to hardware directly. The program calls 0193:0000 (its init, from the startup at 0f99), then 02fb eight times, 030d four times, and 0213, 029c, 01c0 and 016b. Neither has a virtual call site, so neither declares an object type with methods. What would settle both is a linker map, which is blocked behind no-build-toolchain; short of that, disasm.py on 1193's init and on 118a's four routines is the next cheap read."
state = "resolved"
resolution = "BOTH IDENTIFIED by disassembly, and only one of them is ours. 1193 IS THE RTL's Crt UNIT. Its init does `mov ah,0x0f; int 10h` (get video mode), then builds two records at DGROUP 0x3b58 and 0x3c58 and hands each to an RTL routine -- 01f5:0565 and 01f5:056a -- which is Input and Output being assigned to the CRT device. 1193:0180 settles it: four byte parameters read off ss:[bx+4..0xa], each validated against [0x3b52] and [0x3b53], then stored as words into [0x3b4c] and [0x3b4e]. That is Crt.Window writing WindMin and WindMax. Crt is now in link.toml's [lists].rtl -- the runtime's units are not ours to transcribe -- and its segment is named Crt. 118a IS OURS, and it is a mode-13h virtual-screen unit of FIVE routines, not four. 0000: procedure(destSeg, srcSeg) doing `rep movsw` with cx=0x7d00 -- 32000 words = 64000 bytes = one 320x200 screen, so a screen copy or flip; retf 4. 0024: `mov ax,0x13; int 0x10; retf` -- set mode 13h, FRAMELESS and five bytes long. 002a: pushes 0xfa00 and calls 01f5:023f, keeps the returned DX:AX as a pointer at [0x351e], then pushes that pointer, 0xfa00 and 0 and calls 01f5:0f36 -- GetMem(64000) followed by FillChar(p,64000,0), so this allocates and clears the virtual screen. 005e: pushes the pointer and 0xfa00 to 01f5:0254 -- FreeMem. 007a: the unit's initialisation, reached from the startup at 0f9e, which calls 01f5:0d55 and nothing else. Code runs to 0x8b with five bytes of zero padding to 0x90. THE SCOPE THIS SETTLES, and it is much smaller than it looked. Of the six segments, 11f5 is System, 1193 is Crt, 1160 is stock GoldPlay and 12eb is DGROUP. THE DEMO'S OWN CODE IS TWO SEGMENTS: the program at 1000, 0x1600 bytes, and this unit at 118a, 0x8b bytes. Nothing else in the image is ours to write."

[[plan.investigation]]
name = "tp6-patch-level"
finding = "Whether SOFTEL was built by TP 6.0 or 6.01 is NOT settled, and the method that was supposed to settle it does not discriminate. The two patch levels do differ. Compiling one identical program under each gives a SYSTEM segment of 0x85c bytes under TP600 and 0x85e under TP601, and the runtimes share a 142-byte prefix and a 251-byte suffix with several insertions between them; realigning past the first insertion leaves 15 differing runs, and the long ones are the same bytes displaced again rather than different code, so the edits accumulate rather than being one 2-byte patch. So a fingerprint exists in principle. It does not work from a hello-world. rtl.py match locates SOFTEL's runtime at seg 11f5 -- which independently confirms that identification -- and scores the original at 25.9% against TP600 and 26.0% against TP601. That is a dead heat, and the sibling consumer records the same result on its own target at 33.1% against 33.0%. The cause is smart linking: a hello-world pulls a different set of runtime routines than a demo, so the agreement figure is dominated by WHICH routines are present rather than by how each is compiled. The blind spot is therefore in the comparison, not in the tool. WHAT WOULD SETTLE IT: build the real program once src/ has one, so the two images pull a comparable set of routines, and run rtl.py match again like for like. Until then build.toml declares both installs so the question stays measurable, and tp6 is the default only because it must be something."
state = "open"

[[plan.investigation]]
name = "dgroup-is-12eb"
finding = "CORRECTED, and the correction matters for link.toml. The claim that 12eb is 'NOT code -- 79 zero bytes and one 02' is right that it is not code and wrong about what it is: 12eb IS DGROUP, and those 80 bytes are its INITIALISED head. Measured: the load image is 12032 bytes, and 12eb:0050 in image coordinates is 0x2f00 = 12032 exactly, so the file ends 0x50 bytes into this paragraph and everything past that point is the loader's BSS -- which the MZ header's minalloc asks for as 19712 bytes, matching the 0x4d00 Ghidra drew as its DATA block. Ghidra calls 12eb:0000..004f 'CODE_5' because four fixups name paragraph 02eb, but those are references TO the data group -- a MOV AX,DGROUP loading DS -- and not code inside it. So end_at and dgroup_at are both 0x12eb, and link.toml carries 12eb in its [data] list rather than its segment list."
state = "resolved"
resolution = "Applied. link.toml lists 12eb under [data] with the reason, and sets both end_at and dgroup_at to 0x12eb; CLAUDE.md's segment table says DGROUP's initialised head rather than 'not code'. Nothing measured rests on the old reading -- it was written and corrected inside one session -- but the method defect is worth keeping: a fixup that NAMES a paragraph is evidence about the paragraph's role only if you know which direction the reference points, and Ghidra's block classifier does not, so it drew a code segment over the data group's first 80 bytes. This is the second time on this target that reading a role off relocation data was wrong; the first is segment-inventory."

[[plan.investigation]]
name = "binpath-derived-not-typed"
finding = "Removed a machine path from a committed config, on the kit's own evidence. kit c80b0cd derives the DOS bin directory from `toolchain.<compiler>` in kit.local.toml -- the answer that actually invokes the compiler -- so build.toml no longer carries `binpath` for tp6 or tp61. This host's typed copies were CORRECT when written, which is exactly why removing them is worth recording rather than shrugging at: the kit's new observation `typed-copy-of-a-derived-path` measured 15 stale entries across five configs in the sibling consumer against 4 correct ones here, same tool and same mechanism, the difference being only whether that repository had been through a rename. The duplicate lived on the side where being wrong is free -- every invocation BUILD.BAT writes is fully qualified, so the PATH line the typed copy feeds is read by nobody during a build, and fails only at an interactive prompt one person uses occasionally. VERIFIED after removal: build.py --selftest still compiles under tp6, so the derivation reaches the same directory the typed value named."
state = "resolved"
resolution = "Applied and verified in the same iteration; recorded as an investigation rather than a silent edit because the removal deletes a value that was right, and a later reader finding no binpath should be able to tell a deliberate deletion from an omission."

[[plan.investigation]]
name = "survey-misses-frameless-returns"
finding = "survey.py's routine census cannot see a frameless routine, and the count it prints instead reads as a fact. returns() matches the regex [É]](Ê|Ë) -- a far return IMMEDIATELY PRECEDED by LEAVE or POP BP. Its docstring states that requirement; what it does not state is the consequence, which is that a routine reading its parameters off ss:[bx+n] after `mov bx,sp` -- the shape assembler routines and the RTL's own units use -- ends in a bare RETF and is invisible. MEASURED ON THIS TARGET. survey reported 2 far returns in 1193 and 4 in 118a. Disassembly confirms at least two more in 1193 -- Crt.Window's retf 8 at 01bd and a retf 2 at 017d -- and one more in 118a, the frameless mode-set at 0029, so 118a has five routines rather than four. A raw CA/CB byte scan of 1193 finds 33 far returns of which 31 are frameless; that scan OVERCOUNTS (operands such as 8056 and 5770 are plainly data, not stack-cleanup counts) and is not the corrected census -- it establishes the direction and the magnitude, not the number. By contrast 1160, GoldPlay's Pascal unit, is 9 framed and 0 frameless, and survey was exactly right there. WHY IT MATTERS BEYOND THIS TARGET: the count is documented as 'the routine census; the count is a signature', and this project drew an inference straight off it -- a 1568-byte segment showing 2 returns was read as a unit of very few routines. It is really a unit of about thirty assembler ones. That generalises to any binary built this way, so it wants a kit fix AND a wiki observation for the blind spot: report frameless returns separately rather than not at all, since a bare RETF cannot be told from a CA byte in data without a decoder, and the honest output is two counts with the second marked as an upper bound."
state = "resolved"
resolution = "FIXED UPSTREAM in kit fee3f0b, with the wiki observation `anchored-scan-names-its-reach` beside it. returns() keeps its anchored, certain scan and its docstring now states the CONSEQUENCE rather than just the requirement; a new frameless() reports the rest as an explicit UPPER BOUND in two classes -- `RETF nn` with an even operand no greater than 32, and bare RETF, called out as the weaker signal because it has no operand to filter on. Neither number is called a census any more. RE-RUN ON THIS TARGET, because a tool that becomes right is worth re-asking every open question (the kit's own `instruments-have-an-order`): 118a now reports 4 framed plus 1 bare candidate, which is EXACTLY the five routines disassembly confirmed. 1193 reports 2 framed plus 11 sized and 14 bare, and the filter kept 017d/2 and 01bd/8 -- both confirmed by disassembly as Crt.Window and its neighbour -- while rejecting 180, 2539, 4075, 5634, 5770 and 8056, every one of which is data. 1160 reports 9 framed and 0 frameless, unchanged and still exactly right for GoldPlay's Pascal unit. So the bound is tight where it can be and honest where it cannot. CLAUDE.md's warning not to trust the count is removed, because the count no longer claims to be one."

[[plan.investigation]]
name = "rtl-routines-by-call-shape"
finding = "Five runtime entry points now have candidate names, read off how 118a calls them rather than from their bodies. 01f5:023f -- given 0xfa00 on the stack, returns a pointer in DX:AX: GetMem. 01f5:0f36 -- given a pointer, 0xfa00 and 0: FillChar. 01f5:0254 -- given a pointer and 0xfa00, returns nothing: FreeMem. 01f5:0565 and 01f5:056a -- each given DS:DI pointing at a 256-plus-byte DGROUP record during Crt's init: the text-file assign and open pair. 01f5:04df -- called at the head of EVERY framed routine in 118a with `xor ax,ax` immediately before it, so with a size of zero in AX. THESE ARE INFERENCES FROM CALL SHAPE, NOT MEASUREMENTS. rtl.py find is the instrument that confirms a runtime routine, by taking its BODY from a reference and searching -- and it does not report a pattern that matches more than once, so a name it gives is evidence. It needs an RTL.toml naming a reference part and its confirmed offsets, which this target does not have yet. 04df IS THE INTERESTING ONE. A per-routine call with a size in AX at every framed prologue is the shape of a stack check, which would mean the original was compiled $S+ -- and $S+ is TP6's own default, so our build.toml, which asserts no code-generation switch, would already agree. That is worth MEASURING rather than reasoning about: codegen.py exists to put a construct in a probe unit and compare compilers, and the toolchain is now proven, so a unit compiled /$S+ against /$S- settles whether that prologue is what $S+ emits."
state = "resolved"
resolution = "01f5:04df IS THE STACK CHECK, and SOFTEL's own code was compiled $S+. MEASURED, by probes/STACKCHK.PAS through codegen.py against two build.toml entries that differ only in that switch. Under /$S+ a procedure taking parameters and declaring nothing compiles to `55 89 e5 31 c0 9a 00 00 00 00` -- push bp, mov bp,sp, xor ax,ax, lcall to an unresolved far pointer. 118a:0000 is `55 89 e5 31 c0 9a df 04 f5 01`, which is that sequence with the fixup applied. Under /$S- the same procedure goes straight into its body and emits no call at all. The probe's second routine is what makes it a measurement rather than a coincidence: WithLocals, which declares 402 bytes of locals, compiles under /$S+ to `55 89 e5 b8 92 01 9a ... 81 ec 92 01` -- mov ax,0x192, the call, then sub sp,0x192. So the operand is the frame size and the `xor ax,ax` in 118a is a frame size of zero, which is correct for routines that take parameters and declare no locals. A fixed prologue call would not vary. CONSEQUENCE FOR THE BUILD: none, and that is the useful part. $S+ is TPC's own default, so build.toml -- which deliberately asserts no code-generation switch -- already emits this prologue. The switch line was unverified and is now verified for $S. $G and $N remain unmeasured. AND GOLDPLAY WAS COMPILED $S-: segment 1160's routines have a frame but no 04df call anywhere in the segment's far-call list. It is a build input, linked as a prebuilt .TPU rather than recompiled, so its switches are not ours to match -- but the contrast is what made the prologue worth probing. The other four candidate names -- 023f GetMem, 0f36 FillChar, 0254 FreeMem, 0565/056a the text-file assign and open pair -- remain INFERENCES from call shape. rtl.py find is what would confirm them and it needs an RTL.toml naming a reference part, which this target does not have."

[[plan.investigation]]
name = "original-is-g-plus"
finding = "THE ORIGINAL WAS COMPILED /$G+, and the default is measurably wrong. Every framed routine in 118a tears its frame down with `c9` -- LEAVE, which is an 80186/286 instruction and does not exist on an 8086. probes/STACKCHK.PAS through codegen.py settles what emits it: /$S+ alone gives `5d` (POP BP) for a routine with no locals and `89 ec 5d` (MOV SP,BP; POP BP) for one with locals, and adding /$G+ changes exactly ONE byte in the whole probe, `5d` to `c9`. Nothing else in 128 bytes moves. So build.toml now says /$G+ /GD /Q. This is the opposite case to $S and the pair is worth keeping together: $S+ is TPC's default AND what the original shows, so naming it would add a switch that changes nothing; $G+ is NOT the default and IS what the original shows, so leaving it out would have made every framed routine in the reconstruction differ in its last two bytes. build.py's warning is exact -- a wrong switch line does not fail, it produces a build that measures wrong. $N is the one code-generation switch still unmeasured; fpusites.py settles it and needs a linked image."
state = "resolved"
resolution = "Asserted in build.toml with the probe cited beside it, and confirmed by the result it made possible: SCREEN.PAS compiles to the original's bytes, LEAVE included. See screen-unit-transcribed."

[[plan.investigation]]
name = "screen-unit-transcribed"
finding = "src/SCREEN.PAS IS WRITTEN AND ITS CODE IS THE ORIGINAL'S BYTES. units.py reports `identical, 46 pending fixups` over the declared 139 bytes on the FIRST build. The 46 forgiven bytes were checked independently rather than taken on the instrument's word, because 46 of 139 is a third of the unit and that is a lot of forgiveness to accept unexamined. Every one of them is ZERO on our side, they fall in 15 runs of width 2 or 4 only, and they account for themselves exactly: EIGHT four-byte far pointers -- df04f501 four times, which is the stack check once per framed routine, plus 3f02f501 GetMem, 360ff501 FillChar, 5402f501 FreeMem and 550df501 the initialisation's call -- and SEVEN two-byte DGROUP offsets, 1e35 four times for Virtual's offset, 2035 twice for its segment and 423b once for VirtualSeg. 8x4 + 7x2 = 46. Nothing else differs. TWO RISKS WRITTEN INTO THE SOURCE BEFOREHAND BOTH CAME OUT RIGHT, which is worth recording because either would have looked like a transcription defect: `xor si,si` and `xor di,di` have two encodings each and the original uses 31 f6 / 31 ff, which is what Borland's assembler chose; and the frame teardown needed /$G+ to emit LEAVE, which is why original-is-g-plus was measured first. WHAT IS NOT YET TESTED: the variable ADDRESSES. Our .TPU carries zeros where the original carries 1e35, 2035 and 423b, so the DGROUP offsets are supplied by the linker and nothing has compared them. dsmap.py is the instrument and it needs a linked image, so it waits on the program. See screen-dgroup-gap-unexplained. The register now locks coverage at 5 targets, risen from 0. All five are R0 -- a target with no measured rung -- because routines.py measures a LINKED image and there is no program to link yet."
state = "resolved"
resolution = "The unit is done to the limit of what a .TPU can prove. It goes no further until the program exists: a unit's code can be byte-exact while every address the linker fills is wrong, and only a linked image can tell."

[[plan.investigation]]
name = "screen-dgroup-gap-unexplained"
finding = "0x622 BYTES BETWEEN TWO VARIABLES THAT NOTHING DECLARES. The original puts Virtual's four bytes at DS:$351e/$3520 and writes the segment half to DS:$3b42, and SCREEN.PAS declares exactly those two variables and nothing between them. Turbo Pascal allocates a unit's variables in declaration order, so if both belong to this unit there are 0x622 bytes here that no declaration accounts for. Three readings and none is settled: this unit declares something between them that no instruction touches, so no disassembly can see it; or $3b42 is not this unit's variable and the write reaches a global another unit exports; or the two sit in different units' variable blocks. The third is not idle -- Crt's own globals were read at $3b4a, $3b4c, $3b4e, $3b52, $3b53, $3b54, $3b58 and $3c58 while identifying that unit, and $3b42 sits eight bytes below the lowest of them. DO NOT GUESS A FILLER ARRAY TO CLOSE IT. dsgaps.py sorts the DS:$ addresses a project's own source comments record and prints the gap to the next, which IS the size of whatever sits at the first -- it measures the ORIGINAL and needs no build. dsmap.py pairs every absolute data reference with ours and reports the shift, where a run of one non-zero shift names the declaration before it as the wrong size; that one needs a linked image. The source carries this note at the point of use so nobody closes the gap by arithmetic."
state = "open"

[[plan.investigation]]
name = "goldplay-tracking-deferred"
finding = "DEFERRED DELIBERATELY, and left untracked rather than gitignored, so that git status keeps asking. Recorded because the licence research behind it should not have to be redone. goldplay/ is 297K and untracked. GOLDPLAY.DOC states v1.00 is SMILEWARE: shareable on three conditions -- credit the authors, make NO CHANGES TO THE PACKAGE, and send them a postcard -- so redistribution is permitted, and the no-changes clause argues AGAINST cherry-picking GOLDPLAY.TPU out of the directory, which was the obvious small-footprint option. v1.00 SHIPS NO goldplay.pas. Its files are GOLDPLAY.DOC, .OBJ, .OVL, .TPU, PLAY.ASM and TESTPLAY.PAS -- the last is the example program, not the unit. So GOLDPLAY.TPU cannot be rebuilt from source and is an irreplaceable build input the moment the program says `uses GoldPlay`. v1.01 does have goldplay.pas, but the demo shipped v1.00 and the two differ. v1.01 is pure reference EXCEPT that it was load-bearing for one measurement: bin/SOFTEL.OVL is byte-identical to v1.00's GOLDPLAY.OVL (md5 1171f00214f6f1fcad96e704c6a71c0d) and NOT to v1.01's (md5 d07ce9460102d9312bf7736af622e811). Both md5s are recorded here and in overlay-is-stock-goldplay, so dropping v1.01 leaves that finding re-readable and re-checkable against a fresh download rather than only asserted. WHOEVER MAKES THE FIRST COMMIT: do not `git add -A`. goldplay/ appears as untracked and that is its current intended state, not an oversight."
state = "open"

[[plan.investigation]]
name = "ghidra-not-tracked"
finding = "ghidra/ IS DELIBERATELY NOT UNDER SOURCE CONTROL, and this row exists because the reasoning was originally written only into a commit message that was then rewritten away. IT WAS TRACKED FOR FOUR COMMITS: 1.75M, of which 1.75M was two 917504-byte Ghidra buffer files. Those two are not a duplicate pair somebody could trim -- db.1.gbf and db.2.gbf differ, and both are live buffer files of one database. The reason to drop them is what the database CONTAINED: 0 functions and 1 symbol. Auto-analysis had never been run and no person had annotated anything, so every tracked byte was derived from bin/SOFTEL.EXE -- 12832 bytes -- plus the MZ loader's defaults. It is also mutating while Ghidra is open. Softel.lock was held by a live instance the whole time, and a third file of exactly 917504 bytes (tmp*.ps) sat beside the two, so the commit captured a snapshot of files somebody else had open. NOTHING WAS LOST, because everything read out of Ghidra was already text: the memory map in link.toml, target.first_para in kit.toml, the segment identifications and the withdrawn readings in this register, and the instruction-level readings in src/SCREEN.PAS's [re] comments. TO RECREATE IT: import bin/SOFTEL.EXE as x86:LE:16:Real Mode and accept the MZ loader's defaults, which place the load image at 1000:0000 -- that is where first_para comes from. Do not trust the block boundaries it draws; they are 16 bytes out, which load-image-segment-map records. THE STANDING PREFERENCE: if annotation ever accumulates in Ghidra, move it into the sources as @asm markers and [re] prose rather than tracking the database. A marker is read by markers.py and locked by the ratchet; a .gbf is read by nothing and diffed by nothing. The history was rewritten to drop the blobs rather than merely untracking them, which was safe because this repository has no remote and nothing had been published."
state = "resolved"
resolution = "ghidra/ is in .gitignore, CLAUDE.md carries the recreation recipe and the block-boundary warning, and the four commits were rebuilt without the blobs so no history claims ghidra was ever tracked. The working project on disk was never touched."
